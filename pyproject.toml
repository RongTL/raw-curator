[tool.poetry]
name = "raw-curator"
version = "0.1.0"
description = "AI RAW Photo Curation Pipeline (ephemeral single-batch)"
authors = ["Ted Rong <ted_rong@trendmicro.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
typer = "^0.12"
click = "<8.2"
pydantic = "^2.7"
pydantic-settings = "^2.3"
sqlalchemy = "^2.0"
alembic = "^1.13"
sqlite-vec = "^0.1.6"
numpy = "^1.26"
pillow = "^10.3"
xxhash = "^3.4"
imagehash = "^4.3"
opencv-python-headless = "^4.10"
pyexiftool = "^0.5"
rawpy = "^0.21"
lensfunpy = "^1.18"
pillow-heif = "^0.18"
tifffile = "^2024.7"
imagecodecs = "^2024.6"
hdbscan = "^0.8"
scikit-learn = "^1.5"
fastapi = "^0.115"
uvicorn = { version = "^0.30", extras = ["standard"] }
httpx = "^0.27"
rich = "^13.7"
tqdm = "^4.66"
huggingface-hub = "^0.24"

torch = { version = "2.4.0", source = "pytorch-cu124" }
torchvision = { version = "0.19.0", source = "pytorch-cu124" }
open-clip-torch = "^2.26"
aesthetic-predictor-v2-5 = ">=2024.12"
pyiqa = "^0.1.11"
insightface = "^0.7.3"
# <1.23: onnxruntime-gpu 1.23+ PyPI wheels target CUDA 13 (libcudart.so.13);
# the base image and torch cu124 wheels are CUDA 12, so stay on the 1.22.x line.
onnxruntime-gpu = ">=1.18,<1.23"
realesrgan = "^0.3"
basicsr = "^1.4"
facexlib = "^0.3"
codeformer-pip = "^0.0.4"
psutil = "^7.0"
nvidia-ml-py = "^12.560"

[[tool.poetry.source]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
pytest-asyncio = "^0.23"
ruff = "^0.5"
mypy = "^1.10"

[tool.poetry.scripts]
raw-curator = "app.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
# Real RAWs and scratch review artefacts live under tests/data (gitignored); never lint them.
extend-exclude = ["tests/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
# N812: `import torch.nn.functional as F` is the universal torch idiom.
ignore = ["E501", "N812"]

[tool.ruff.lint.per-file-ignores]
# Vendored upstream architecture (github.com/cszn/SCUNet); kept diff-able.
"app/enhancement/_scunet_arch.py" = ["N806", "B006"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Vendored upstream architecture (github.com/cszn/SCUNet); not ours to annotate.
module = "app.enhancement._scunet_arch"
ignore_errors = true

[[tool.mypy.overrides]]
# numpy arithmetic on dtype-agnostic arrays (app.arrays.Array) is typed Any by
# the numpy stubs, so every `return a * b` here would trip warn_return_any.
module = "app.enhancement.*"
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA",
    "real_raw: requires real RAW fixtures in tests/data/",
]
